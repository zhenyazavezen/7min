<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven — Тренировки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            user-select: none;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 16px;
        }

        .buy-banner {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(46, 166, 255, 0.3);
            transition: transform 0.1s ease;
        }

        .buy-banner:active {
            transform: scale(0.98);
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--hint-color);
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            font-size: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
        }

        .lock-icon {
            font-size: 18px;
            opacity: 0.8;
        }

        /* Стили для экрана подразделов тренировок */
        .workout-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .workout-card:active {
            transform: scale(0.98);
        }

        .workout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .workout-name {
            font-size: 17px;
            font-weight: 600;
        }

        .workout-meta {
            font-size: 13px;
            color: var(--button-color);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .workout-desc {
            font-size: 14px;
            color: var(--hint-color);
            line-height: 1.4;
            white-space: pre-line;
        }

        .back-btn {
            background: transparent;
            color: var(--button-color);
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen">
        <h1>💪 Seven</h1>
        <div class="subtitle" id="subtitle">Проверка подписки...</div>

        <button class="buy-banner" id="buyBtn" onclick="openSubscription()" style="display: none;">
            Разблокировать на 1 месяц ⭐️
        </button>

        <div class="section-title">Категории тренировок</div>

        <!-- Теперь все категории вызывают openCategory -->
        <div class="card" onclick="openCategory('start')">
            <div class="card-info"><span class="card-icon">⚡</span><span class="card-title">1. Для начала</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('mobility')">
            <div class="card-info"><span class="card-icon">🧘</span><span class="card-title">2. Подвижность</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('weight_loss')">
            <div class="card-info"><span class="card-icon">🔥</span><span class="card-title">3. Сброс веса</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('in_shape')">
            <div class="card-info"><span class="card-icon">⭐️</span><span class="card-title">4. Быть в форме</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('special')">
            <div class="card-info"><span class="card-icon">🎯</span><span class="card-title">5. Специальные</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('beach')">
            <div class="card-info"><span class="card-icon">🏖️</span><span class="card-title">6. К пляжу готов</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('challenge')">
            <div class="card-info"><span class="card-icon">🚀</span><span class="card-title">7. Примите вызов</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('nutrition')">
            <div class="card-info"><span class="card-icon">🥗</span><span class="card-title">8. Питание</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('fasting')">
            <div class="card-info"><span class="card-icon">⏱️</span><span class="card-title">9. Интервальное голодание</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
        <div class="card" onclick="openCategory('music')">
            <div class="card-info"><span class="card-icon">🎵</span><span class="card-title">10. Музыка</span></div>
            <span class="lock-icon main-lock">🔒</span>
        </div>
    </div>

    <!-- ЭКРАН ПОДРАЗДЕЛОВ -->
    <div id="sub-screen" class="hidden">
        <button class="back-btn" onclick="goBackToMain()">← Назад к категориям</button>
        <h1 id="sub-title">⚡ Для начала</h1>
        <div class="subtitle" id="sub-subtitle">Выберите тренировку для старта</div>

        <div id="workouts-list">
            <!-- Динамический список тренировок -->
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const INVOICE_LINK = 'https://t.me/$eM-_apukiUtDGgAAjhEa2eMnaYQ';
        const DEV_USERNAME = 'zhenya_zavezen';
        let isSubscribed = false;
        let currentCategory = 'start';

        // 1. Данные раздела «Для начала»
        const startWorkouts = [
            { title: "Все тело", meta: "12 упражнений • 07:50 мин.", desc: "Научно доказано, что так обеспечиваются самые лучшие результаты в кратчайшие сроки.", link: "https://t.me/c/2527751508/2/57" },
            { title: "Верхняя часть", meta: "12 упражнений • 07:50 мин.", desc: "Руки, плечи, грудь и верхняя часть спины — всё здесь для отличной тренировки.", link: "https://t.me/c/2527751508/2/58" },
            { title: "Нижняя часть", meta: "12 упражнений • 07:50 мин.", desc: "Цель этой тренировки — ягодицы и ноги с идеальным балансом силы и кардио.", link: "https://t.me/c/2527751508/2/65" },
            { title: "Гибкость", meta: "12 упражнений • 07:50 мин.", desc: "Увеличьте амплитуду движений и уменьшите ограничения мышц.", link: "https://t.me/c/2527751508/2/70" },
            { title: "Учебка", meta: "12 упражнений • 07:50 мин.", desc: "Сосредоточьтесь на основных группах мышц. Попробуйте высокоинтенсивную тренировку.", link: "https://t.me/c/2527751508/2/71" },
            { title: "Спина и передняя часть", meta: "12 упражнений • 07:50 мин.", desc: "Если давать каждой половине тела отдохнуть по очереди, вы сможете быстрее восстановиться.", link: "https://t.me/c/2527751508/2/72" },
            { title: "Верх и низ", meta: "12 упражнений • 07:50 мин.", desc: "Переключение нагрузки между верхней и нижней частями тела.", link: "https://t.me/c/2527751508/2/73" },
            { title: "Легкая форма", meta: "12 упражнений • 07:50 мин.", desc: "Приведите себя в форму, выполняя эту простую тренировку.", link: "https://t.me/c/2527751508/2/74" },
            { title: "Функциональная (новичок)", meta: "12 упражнений • 07:50 мин.", desc: "Доведите каждую часть своего тела до предела возможностей.", link: "https://t.me/c/2527751508/2/75" },
            { title: "На четвереньках", meta: "12 упражнений • 07:50 мин.", desc: "Набор упражнений на полу уменьшает риск травм.", link: "https://t.me/c/2527751508/2/81" },
            { title: "Разогрев", meta: "12 упражнений • 07:50 мин.", desc: "Отличный способ начать день. Разогрейте мышцы и суставы.", link: "https://t.me/c/2527751508/2/82" },
            { title: "Я здесь первый раз", meta: "12 упражнений • 07:50 мин.", desc: "Впервые в Seven? Эти простые упражнения выработают новую привычку!", link: "https://t.me/c/2527751508/2/83" },
            { title: "Старший", meta: "12 упражнений • 07:50 мин.", desc: "Специально разработана для новичков и тех, кому больше 65 лет.", link: "https://t.me/c/2527751508/2/84" },
            { title: "Работа над корпусом", meta: "12 упражнений • 07:50 мин.", desc: "Ищете идеальное начало для своего фитнес-курса? Вы его нашли!", link: "https://t.me/c/2527751508/2/85" },
            { title: "Малая ударная нагрузка", meta: "12 упражнений • 07:50 мин.", desc: "Прокачайте свою кровь и укрепите мышцы с помощью этой комфортной тренировки.", link: "https://t.me/c/2527751508/2/86" }
        ];

        // 4. Данные раздела «Быть в форме»
        const inShapeWorkouts = [
            { title: "Сердце", meta: "12 упражнений • 07:50 мин.", desc: "Идите ва-банк и терпите до конца, чтобы укрепить и прибавить здоровья сердцу! Улучшенная выносливость гарантирована.", link: "https://t.me/c/2527751508/144/376" },
            { title: "Взрывные", meta: "12 упражнений • 07:50 мин.", desc: "Тренируйтесь, как атлет! Взрывные упражнения для всего тела отлично подходят для развития практической скорости и силы.", link: "https://t.me/c/2527751508/144/377" },
            { title: "Сила", meta: "12 упражнений • 07:50 мин.", desc: "Благодаря этой тренировке для контроля веса тела вы укрепите весь свой организм. Время качаться!", link: "https://t.me/c/2527751508/144/378" },
            { title: "Атлетические", meta: "12 упражнений • 07:50 мин.", desc: "Приемы из спортивных программ тренировок, которые откроют вам желанные грани физической подготовки.", link: "https://t.me/c/2527751508/144/379" },
            { title: "Резкие всплески", meta: "16 упражнений • 07:50 мин.", desc: "Резкие всплески идеально подойдут для сжигания жира, увеличения мышечной массы и улучшения аэробной способности.", link: "https://t.me/c/2527751508/144/380" },
            { title: "Лечебная физкультура", meta: "16 упражнений • 07:50 мин.", desc: "Поднимите уровень аэробной и анаэробной выносливости, повысив метаболизм и частоту сердечных сокращений.", link: "https://t.me/c/2527751508/144/381" },
            { title: "Сердце и пресс", meta: "12 упражнений • 07:50 мин.", desc: "Идеальное сочетание тренировки для сердца и мышц пресса для повышения тонуса организма.\n\nТеряйте жир и наращивайте мышцы.", link: "https://t.me/c/2527751508/144/382" },
            { title: "Профи для всего тела", meta: "12 упражнений • 07:50 мин.", desc: "Тренировка для всего тела, которую мы все обожаем, теперь вышла на новый уровень благодаря свежему взгляду.", link: "https://t.me/c/2527751508/144/383" },
            { title: "Выбор тренера", meta: "12 упражнений • 07:50 мин.", desc: "Разработанная нашим тренером всеобъемлющая тренировка, со всеми преимуществами тренировки для всего тела.", link: "https://t.me/c/2527751508/144/384" },
            { title: "Пластика", meta: "12 упражнений • 07:50 мин.", desc: "Основа упражнений для контроля веса тела.\n\nРазвивайте силу, физическую форму и гибкость, баланс, подвижность и координацию движений.", link: "https://t.me/c/2527751508/144/385" },
            { title: "Силовая тренировка сердца", meta: "12 упражнений • 07:50 мин.", desc: "Включает элемент движений на основе навыков. Результаты становятся лучше, а веселье больше.", link: "https://t.me/c/2527751508/144/386" },
            { title: "Динамическая", meta: "12 упражнений • 07:50 мин.", desc: "Многомерная тренировка, предназначенная для улучшения различных аспектов ваших способностей.", link: "https://t.me/c/2527751508/144/387" },
            { title: "Форсаж", meta: "12 упражнений • 07:50 мин.", desc: "Больше силы и улучшенная подвижность благодаря этой функциональной и динамичной тренировке.", link: "https://t.me/c/2527751508/144/388" },
            { title: "ИТВИ и отдых", meta: "12 упражнений • 07:50 мин.", desc: "Быстрый и эффективный результат от сочетания упражнений ИТВИ и упражнений на подвижность решение 50/50.", link: "https://t.me/c/2527751508/144/389" },
            { title: "Вместе сильнее", meta: "12 упражнений • 07:50 мин.", desc: "Эта силовая и кардио-тренировка на основе ВИТ отлично подходит для выполнения в одиночку или с партнером.", link: "https://t.me/c/2527751508/144/390" },
            { title: "Активное восстановление", meta: "6 упражнений • 06:50 мин.", desc: "Легкая тренировка для успокоения воспаленных мышц и восстановления после тяжелых тренировок.", link: "https://t.me/c/2527751508/144/391" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const user = tg.initDataUnsafe?.user;
            const rawUsername = user?.username || '';
            const currentUsername = rawUsername.replace('@', '').trim().toLowerCase();

            // Проверка на разработчика
            if (currentUsername === DEV_USERNAME.toLowerCase()) {
                unlockAll('Режим разработчика (@zhenya_zavezen)');
                return;
            }

            // Проверка стандартной подписки через CloudStorage
            tg.CloudStorage.getItem('subscription_expires', (err, expireDateStr) => {
                const now = new Date().getTime();

                if (!err && expireDateStr && now < Number(expireDateStr)) {
                    unlockAll('PREMIUM доступ активен');
                } else {
                    document.getElementById('buyBtn').style.display = 'block';
                    document.getElementById('subtitle').innerHTML = 'Тренировки для трансформации тела';
                }
            });
        });

        // Функция открытия категории
        function openCategory(categoryName) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            // Если подписки нет — направляем на оплату
            if (!isSubscribed) {
                openSubscription();
                return;
            }

            // Если доступ открыт (Разработчик или Подписка)
            if (categoryName === 'start') {
                document.getElementById('sub-title').textContent = '⚡ Для начала';
                document.getElementById('sub-subtitle').textContent = 'Выберите тренировку для старта';
                renderWorkoutsList('start');
            } else if (categoryName === 'in_shape') {
                document.getElementById('sub-title').textContent = '⭐️ Быть в форме';
                document.getElementById('sub-subtitle').textContent = 'Поддерживайте своё тело в идеальном тонусе';
                renderWorkoutsList('in_shape');
            } else {
                tg.showAlert('Этот раздел находится в разработке и скоро будет доступен!');
                return;
            }

            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('sub-screen').classList.remove('hidden');
        }

        // Отрисовка тренировок текущего раздела
        function renderWorkoutsList(category) {
            currentCategory = category;
            const container = document.getElementById('workouts-list');
            container.innerHTML = '';

            const activeList = category === 'in_shape' ? inShapeWorkouts : startWorkouts;

            activeList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'workout-card';
                card.onclick = () => handleWorkoutClick(item.link);

                card.innerHTML = `
                    <div class="workout-header">
                        <span class="workout-name">${item.title}</span>
                        <span class="lock-icon">${isSubscribed ? '▶️' : '🔒'}</span>
                    </div>
                    <div class="workout-meta">${item.meta}</div>
                    <div class="workout-desc">${item.desc}</div>
                `;
                container.appendChild(card);
            });
        }

        function goBackToMain() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            document.getElementById('sub-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
        }

        function handleWorkoutClick(url) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (isSubscribed) {
                tg.openTelegramLink(url);
            } else {
                openSubscription();
            }
        }

        function openSubscription() {
            const user = tg.initDataUnsafe?.user;
            const rawUsername = user?.username || '';
            const currentUsername = rawUsername.replace('@', '').trim().toLowerCase();

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (currentUsername === DEV_USERNAME.toLowerCase()) {
                tg.showAlert('Режим разработчика активен. Доступ уже бесплатный!');
                return;
            }

            tg.openInvoice(INVOICE_LINK, (status) => {
                if (status === 'paid') {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    
                    const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
                    const expiresAt = new Date().getTime() + thirtyDaysMs;

                    tg.CloudStorage.setItem('subscription_expires', String(expiresAt), (err, saved) => {
                        if (saved) {
                            unlockAll('PREMIUM доступ активирован на 30 дней');
                            tg.showAlert('🎉 Оплата прошла успешно! Подписка оформлена на 1 месяц.');
                        }
                    });
                } else if (status === 'failed') {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert('Не удалось провести платеж. Попробуйте еще раз.');
                }
            });
        }

        function unlockAll(statusText) {
            isSubscribed = true;
            document.querySelectorAll('.main-lock').forEach(icon => icon.textContent = '▶️');
            
            const buyBtn = document.getElementById('buyBtn');
            if (buyBtn) buyBtn.style.display = 'none';
            
            const subtitle = document.getElementById('subtitle');
            if (subtitle) {
                subtitle.innerHTML = 'Статус: <b style="color: #32d74b;">' + statusText + '</b>';
            }
        }
    </script>
</body>
</html>
