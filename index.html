<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>7Min — Тренировки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--hint-color);
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            font-size: 22px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
        }

        .lock-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>7Min</h1>
    <div class="subtitle">Тренировки для трансформации тела</div>

    <div class="section-title">Категории тренировок</div>

    <!-- Категории -->
    <div class="card" onclick="handleCardClick('1. Для начала', true)">
        <div class="card-info">
            <span class="card-icon">⚡</span>
            <span class="card-title">1. Для начала</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="handleCardClick('2. Подвижность', true)">
        <div class="card-info">
            <span class="card-icon">🧘</span>
            <span class="card-title">2. Подвижность</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="handleCardClick('3. Сброс веса', true)">
        <div class="card-info">
            <span class="card-icon">🔥</span>
            <span class="card-title">3. Сброс веса</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="handleCardClick('4. Быть в форме', true)">
        <div class="card-info">
            <span class="card-icon">⭐</span>
            <span class="card-title">4. Быть в форме</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Главная функция при клике на категорию
        function handleCardClick(title, isLocked) {
            // Тактильный виброотклик смартфона
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            if (!isLocked) {
                // Если раздел открыт — переходим к нему
                openCategory(title);
            } else {
                // Если закрыт — СРАЗУ вызываем окно оплаты Telegram Stars без лишних "ОК"
                startStarsPayment(title);
            }
        }

        function startStarsPayment(title) {
            // Если у тебя есть готовая ссылка на invoice от бота:
            // tg.openInvoice("ССЫЛКА_НА_СЧЕТ_STARS", function(status) { ... });

            // Для прямой подписки через бота:
            tg.openTelegramLink("https://t.me/zhenya_zavezen_bot");
        }

        function openCategory(title) {
            console.log("Открываем раздел:", title);
        }
    </script>
</body>
</html>
