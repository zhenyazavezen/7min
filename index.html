<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Seven Minutes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --bg-color: #0f1115;
    --surface-color: #1a1e24;
    --surface-hover: #252b33;
    --text-primary: #ffffff;
    --text-secondary: #9aa0a6;
    --border-color: #2c3440;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 16px;
    display: flex;
    flex-direction: column;
}

.screen {
    display: none;
    flex-direction: column;
    flex: 1;
}

.screen.active {
    display: flex;
}

.logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
}

.subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 16px 20px;
    margin: 6px 0;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    background: var(--surface-color);
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

button:active {
    transform: scale(0.98);
}

button:hover {
    background: var(--surface-hover);
}

.btn-start {
    background: #ffffff;
    color: #0f1115;
    border: none;
    text-align: center;
    font-weight: 700;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 17px;
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
}

.btn-start:hover {
    background: #e0e0e0;
}

.section-title {
    color: var(--text-secondary);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin: 16px 0 8px 0;
    font-weight: 600;
}

/* Плеер тренировки */
.player-screen {
    justify-content: space-between;
    height: 100vh;
    padding: 10px 0 16px 0;
    box-sizing: border-box;
}

.player-header {
    display: flex;
    flex-direction: column;
}

.video-container {
    width: 100%;
    flex: 1;
    background: #000;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    position: relative;
    overflow: hidden;
    margin: 12px 0;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}

.video-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.timer-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-color);
    padding: 12px 20px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    margin-bottom: 12px;
}

.timer-label {
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
}

.timer {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
}

.back-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    text-align: left;
    padding: 0;
    margin-bottom: 6px;
    font-size: 14px;
    width: auto;
}
</style>
</head>
<body>

<div class="app-container">

    <div id="main-screen" class="screen active">
        <div class="logo">💪 The Seven Minutes</div>
        <div class="subtitle">Тренировки для трансформации тела</div>

        <div class="section-title">Категории тренировок</div>
        <button onclick="startWorkout(0)">⚡ 1. Для начала <span>→</span></button>
        <button onclick="startWorkout(1)">🧘‍♂️ 2. Подвижность <span>→</span></button>
        <button onclick="startWorkout(2)">🔥 3. Сброс веса <span>→</span></button>
        <button onclick="startWorkout(3)">🏋️‍♂️ 4. Быть в форме <span>→</span></button>
        <button onclick="startWorkout(4)">🎯 5. Специальные <span>→</span></button>
        <button onclick="startWorkout(5)">🏖️ 6. К пляжу готов <span>→</span></button>
        <button onclick="startWorkout(6)">🚀 7. Примите вызов <span>→</span></button>
        <button onclick="startWorkout(7)">🍎 8. Питание <span>→</span></button>
        <button onclick="startWorkout(8)">⏱️ 9. Интервальное голодание <span>→</span></button>
        <button onclick="startWorkout(9)">🎵 10. Музыка <span>→</span></button>

        <div class="section-title">Дополнительно</div>
        <button onclick="showScreen('progress-screen')">📈 Мой прогресс <span>→</span></button>
        <button onclick="openChannel()">📢 Наш Telegram-канал <span>→</span></button>
    </div>

    <div id="player-screen" class="screen player-screen">
        <div class="player-header">
            <button class="back-btn" onclick="showScreen('main-screen')">← На главную</button>
            <div id="exercise-counter" style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;"></div>
            <div id="exercise-title" style="font-size: 20px; font-weight: 700; margin-top: 2px;"></div>
        </div>

        <div class="video-container">
            <video id="ex-video" src="" autoplay loop muted playsinline poster="https://via.placeholder.com/400x800/000000/FFFFFF/?text=Загрузите+видео"></video>
        </div>

        <div>
            <div class="timer-box">
                <span class="timer-label">Осталось времени</span>
                <div class="timer" id="timer">30</div>
            </div>
            <button class="btn-start" onclick="nextExercise()" style="margin-bottom: 0;">Завершить / Дальше →</button>
        </div>
    </div>

    <div id="progress-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main-screen')">← На главную</button>
        <div class="logo">🔥 Мой прогресс</div>
        <div class="subtitle">Ваша статистика и регулярность</div>
        
        <div style="background: var(--surface-color); padding: 24px; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; margin-bottom: 15px;">
            <div style="font-size: 40px; font-weight: 800;">0 дней</div>
            <div style="color: var(--text-secondary); font-size: 14px; margin-top: 6px;">Серия тренировок (Streak)</div>
        </div>
    </div>

</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo(0, 0);
}

function openChannel() {
    window.open('https://t.me/+7zIjdiWEi0M1YjMy', '_blank');
}

// Список твоих тренировок. 
// Загрузи файлы video1.mp4, video2.mp4 и т.д. в репозиторий GitHub.
const exercises = [
    { title: "Для начала: 12 упражнений", video: "./video1.mp4", time: 45 },
    { title: "Подвижность: активное растягивание", video: "./video2.mp4", time: 45 },
    { title: "Сброс веса", video: "./video3.mp4", time: 45 },
    { title: "Быть в форме", video: "./video4.mp4", time: 45 },
    { title: "Специальные: после бега", video: "./video5.mp4", time: 45 },
    { title: "К пляжу готов", video: "./video6.mp4", time: 45 },
    { title: "Примите вызов: режим ракеты", video: "./video7.mp4", time: 60 },
    { title: "Питание (Инфо)", video: "./video8.mp4", time: 30 },
    { title: "Интервальное голодание (Инфо)", video: "./video9.mp4", time: 30 },
    { title: "Музыка для тренировок", video: "./video10.mp4", time: 60 }
];

let currentExIndex = 0;
let countdown;

function startWorkout(index) {
    currentExIndex = index;
    showScreen('player-screen');
    loadExercise(currentExIndex);
}

function loadExercise(index) {
    clearInterval(countdown);
    let ex = exercises[index];
    document.getElementById('exercise-title').innerText = ex.title;
    document.getElementById('exercise-counter').innerText = `Раздел ${index + 1} из ${exercises.length}`;
    
    let videoElement = document.getElementById('ex-video');
    videoElement.src = ex.video;
    // Пытаемся запустить видео
    videoElement.play().catch(e => console.log("Ждем загрузки видео пользователем"));

    startTimer(ex.time);
}

function startTimer(seconds) {
    let timeLeft = seconds;
    document.getElementById('timer').innerText = timeLeft;
    
    countdown = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            nextExercise();
        }
    }, 1000);
}

function nextExercise() {
    currentExIndex++;
    if (currentExIndex < exercises.length) {
        loadExercise(currentExIndex);
    } else {
        alert('Отличная работа! Вы посмотрели все разделы.');
        showScreen('main-screen');
    }
}
</script>

</body>
</html>
