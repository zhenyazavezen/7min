<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven — Тренировки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            user-select: none;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 16px;
        }

        .buy-banner {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(46, 166, 255, 0.3);
            transition: transform 0.1s ease;
        }

        .buy-banner:active {
            transform: scale(0.98);
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--hint-color);
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            font-size: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
        }

        .lock-icon {
            font-size: 18px;
            opacity: 0.8;
        }

        .dev-footer {
            text-align: center;
            padding: 20px 0;
            font-size: 12px;
            color: var(--hint-color);
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <h1>💪 Seven</h1>
    <div class="subtitle" id="subtitle">Тренировки для трансформации тела</div>

    <!-- Кнопка вызова оплаты -->
    <button class="buy-banner" id="buyBtn" onclick="openSubscription()">
        Разблокировать все разделы ⭐️
    </button>

    <div class="section-title">Категории тренировок</div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">⚡</span>
            <span class="card-title">1. Для начала</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🧘</span>
            <span class="card-title">2. Подвижность</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🔥</span>
            <span class="card-title">3. Сброс веса</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">⭐️</span>
            <span class="card-title">4. Быть в форме</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🎯</span>
            <span class="card-title">5. Специальные</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🏖️</span>
            <span class="card-title">6. К пляжу готов</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🚀</span>
            <span class="card-title">7. Примите вызов</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🥗</span>
            <span class="card-title">8. Питание</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">⏱️</span>
            <span class="card-title">9. Интервальное голодание</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🎵</span>
            <span class="card-title">10. Музыка</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="dev-footer">
        Seven App v1.0
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const INVOICE_LINK = 'https://t.me/$eM-_apukiUtDGgAAjhEa2eMnaYQ';
        
        // Твой ник разработчика (без @)
        const DEV_USERNAME = 'zhenya_zavezen'; 

        // Проверяем доступ при загрузке
        document.addEventListener("DOMContentLoaded", () => {
            // Получаем ник текущего пользователя из Telegram
            const userUsername = tg.initDataUnsafe?.user?.username;

            // Если зашёл разработчик ИЛИ у обычного юзера есть оплата в localStorage
            if (userUsername === DEV_USERNAME || localStorage.getItem('isPremium') === 'true') {
                unlockAll();

                // Показываем подпись, если это именно ты
                if (userUsername === DEV_USERNAME) {
                    const subtitle = document.getElementById('subtitle');
                    if (subtitle) {
                        subtitle.innerHTML = 'Статус: <b style="color: #2ea6ff;">Режим разработчика (@zhenya_zavezen)</b>';
                    }
                }
            }
        });

        // Функция покупки
        function openSubscription() {
            const userUsername = tg.initDataUnsafe?.user?.username;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Если ты разработчик или пользователь оплатил — не вызываем счет
            if (userUsername === DEV_USERNAME || localStorage.getItem('isPremium') === 'true') {
                tg.showAlert('Раздел открыт! Приятной тренировки 💪');
                return;
            }

            // Вызов нативного окна оплаты Telegram
            tg.openInvoice(INVOICE_LINK, (status) => {
                if (status === 'paid') {
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                    localStorage.setItem('isPremium', 'true');
                    unlockAll();
                    tg.showAlert('🎉 Оплата прошла успешно! Полный доступ в Seven разблокирован.');
                } else if (status === 'failed') {
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                    tg.showAlert('Не удалось провести платеж. Попробуйте еще раз.');
                }
            });
        }

        // Функция открытия всех разделов
        function unlockAll() {
            const lockIcons = document.querySelectorAll('.lock-icon');
            lockIcons.forEach(icon => {
                icon.textContent = '▶️';
            });

            const buyBtn = document.getElementById('buyBtn');
            if (buyBtn) {
                buyBtn.style.display = 'none';
            }

            const subtitle = document.getElementById('subtitle');
            if (subtitle) {
                subtitle.innerHTML = 'Статус: <b style="color: #32d74b;">PREMIUM доступ активирован</b>';
            }
        }
    </script>
</body>
</html>
