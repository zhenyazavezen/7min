<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Min</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1c1c1e;
            --accent-color: #ff3b30;
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 6px 0 0 0;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .category-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            color: var(--text-color);
        }

        .category-card:active {
            transform: scale(0.98);
            background-color: #2c2c2e;
        }

        .category-card.locked {
            opacity: 0.8;
        }

        .category-title {
            font-size: 16px;
            font-weight: 600;
        }

        .arrow {
            color: var(--text-secondary);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>💪 7Min</h1>
        <p>Тренировки для трансформации тела</p>
    </div>

    <div class="section-title">Категории тренировок</div>

    <!-- Бесплатный ознакомительный раздел -->
    <div class="category-card" onclick="openLink('https://t.me/c/2527751508/2/57')">
        <span class="category-title">⚡ 1. Для начала (Бесплатно)</span>
        <span class="arrow">→</span>
    </div>

    <!-- Платные разделы с замком -->
    <div class="category-card locked" onclick="requireSubscription('2. Подвижность')">
        <span class="category-title">🧘‍♂️ 2. Подвижность</span>
        <span class="arrow">🔒</span>
    </div>

    <div class="category-card locked" onclick="requireSubscription('3. Сброс веса')">
        <span class="category-title">🔥 3. Сброс веса</span>
        <span class="arrow">🔒</span>
    </div>

    <div class="category-card locked" onclick="requireSubscription('4. Быть в форме')">
        <span class="category-title">🏋️‍♂️ 4. Быть в форме</span>
        <span class="arrow">🔒</span>
    </div>

    <div class="category-card locked" onclick="requireSubscription('5. Специальные тренировки')">
        <span class="category-title">🎯 5. Специальные тренировки</span>
        <span class="arrow">🔒</span>
    </div>

    <div class="category-card locked" onclick="requireSubscription('6. К пляжу готов')">
        <span class="category-title">🏖️ 6. К пляжу готов</span>
        <span class="arrow">🔒</span>
    </div>

    <div class="category-card locked" onclick="requireSubscription('7. Режим ракеты')">
        <span class="category-title">🚀 7. Режим ракеты</span>
        <span class="arrow">🔒</span>
    </div>

    <div class="section-title">Дополнительно</div>

    <div class="category-card locked" onclick="requireSubscription('Основы питания')">
        <span class="category-title">🍎 Основы питания</span>
        <span class="arrow">🔒</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ссылка на бота для оформления подписки
        const PAY_LINK = 'https://t.me/zhenya_zavezen_bot';

        // Открытие внешних ссылок (на бесплатное видео)
        function openLink(url) {
            if (tg.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.location.href = url;
            }
        }

        // Подтверждение подписки с закрытием Mini App
        function requireSubscription(sectionName) {
            if (tg.showConfirm) {
                tg.showConfirm(
                    `Раздел "${sectionName}" доступен по подписке.\n\nПерейти к оформлению подписки за Telegram Stars?`, 
                    function(ok) {
                        if (ok) {
                            if (tg.openTelegramLink) {
                                tg.openTelegramLink(PAY_LINK);
                            }
                            // Закрываем приложение, чтобы пользователь оказался в чате с ботом
                            tg.close();
                        }
                    }
                );
            } else {
                if (confirm(`Раздел "${sectionName}" доступен по подписке. Перейти к оформлению?`)) {
                    if (tg.openTelegramLink) {
                        tg.openTelegramLink(PAY_LINK);
                    }
                    tg.close();
                }
            }
        }
    </script>
</body>
</html>
