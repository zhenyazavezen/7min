<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Min — Тренировки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--hint-color);
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            font-size: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
        }

        .lock-icon {
            font-size: 18px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>💪 7Min</h1>
    <div class="subtitle">Тренировки для трансформации тела</div>

    <div class="section-title">Категории тренировок</div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">⚡</span>
            <span class="card-title">1. Для начала</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🧘</span>
            <span class="card-title">2. Подвижность</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🔥</span>
            <span class="card-title">3. Сброс веса</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">⭐️</span>
            <span class="card-title">4. Быть в форме</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🎯</span>
            <span class="card-title">5. Специальные</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🏖️</span>
            <span class="card-title">6. К пляжу готов</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🚀</span>
            <span class="card-title">7. Примите вызов</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🥗</span>
            <span class="card-title">8. Питание</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">⏱️</span>
            <span class="card-title">9. Интервальное голодание</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <div class="card" onclick="openSubscription()">
        <div class="card-info">
            <span class="card-icon">🎵</span>
            <span class="card-title">10. Музыка</span>
        </div>
        <span class="lock-icon">🔒</span>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Ссылка на ваш платный канал для оплаты
        const PAY_LINK = 'https://t.me/+y2_XMprwee9mNWEy';

        function openSubscription() {
            // Легкая вибрация для приятного отклика
            tg.HapticFeedback.impactOccurred('medium');
            
            // Сразу открываем системную шторку оплаты Telegram Stars
            tg.openTelegramLink(PAY_LINK);
        }
    </script>
</body>
</html>
