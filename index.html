<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>7Min — Тренировки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            var(--bg-color: var(--tg-theme-bg-color, #1c1d22);
            var(--text-color: var(--tg-theme-text-color, #ffffff);
            var(--hint-color: var(--tg-theme-hint-color, #707579);
            var(--card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1c1d22);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #707579);
            margin: 0;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--tg-theme-hint-color, #707579);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .card:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            font-size: 22px;
            width: 28px;
            text-align: center;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
        }

        .lock-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>7Min</h1>
        <p class="subtitle">Тренировки для трансформации тела</p>
    </div>

    <div class="section-title">Категории тренировок</div>

    <div class="card-list">
        <div class="card" onclick="handleCardClick('1', true)">
            <div class="card-info">
                <span class="card-icon">⚡</span>
                <span class="card-title">1. Для начала</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('2', true)">
            <div class="card-info">
                <span class="card-icon">🧘</span>
                <span class="card-title">2. Подвижность</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('3', true)">
            <div class="card-info">
                <span class="card-icon">🔥</span>
                <span class="card-title">3. Сброс веса</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('4', true)">
            <div class="card-info">
                <span class="card-icon">⭐</span>
                <span class="card-title">4. Быть в форме</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('5', true)">
            <div class="card-info">
                <span class="card-icon">🎯</span>
                <span class="card-title">5. Специальные</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('6', true)">
            <div class="card-info">
                <span class="card-icon">⛱️</span>
                <span class="card-title">6. К пляжу готов</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('7', true)">
            <div class="card-info">
                <span class="card-icon">🚀</span>
                <span class="card-title">7. Примите вызов</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('8', true)">
            <div class="card-info">
                <span class="card-icon">🥗</span>
                <span class="card-title">8. Питание</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('9', true)">
            <div class="card-info">
                <span class="card-icon">⏱️</span>
                <span class="card-title">9. Интервальное голодание</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>

        <div class="card" onclick="handleCardClick('10', true)">
            <div class="card-info">
                <span class="card-icon">🎵</span>
                <span class="card-title">10. Музыка</span>
            </div>
            <span class="lock-icon">🔒</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем окно на максимум

        function handleCardClick(categoryId, isLocked) {
            // Легкая вибрация телефона при клике (работает на большинстве смартфонов)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            if (isLocked) {
                // Если категория под замком — СРАЗУ открываем ссылку на подписку
                tg.openTelegramLink("https://t.me/+y2_XMprwee9mNWEy");
            } else {
                console.log("Открыт раздел:", categoryId);
            }
        }
    </script>
</body>
                    </html>
