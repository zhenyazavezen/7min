<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Min</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1c1c1e;
            --accent-color: #ff3b30;
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 6px 0 0 0;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .category-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            color: var(--text-color);
        }

        .category-card:active {
            transform: scale(0.98);
            background-color: #2c2c2e;
        }

        .category-title {
            font-size: 16px;
            font-weight: 600;
        }

        .arrow {
            color: var(--text-secondary);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>💪 7Min</h1>
        <p>Тренировки для трансформации тела</p>
    </div>

    <div class="section-title">Категории тренировок</div>

    <!-- КАТЕГОРИЯ 1: Привязана к твоему видео -->
    <div class="category-card" onclick="openPost('https://t.me/c/2527751508/2/57')">
        <span class="category-title">⚡ 1. Для начала</span>
        <span class="arrow">→</span>
    </div>

    <div class="category-card" onclick="alert('Этот раздел находится в разработке')">
        <span class="category-title">🧘‍♂️ 2. Подвижность</span>
        <span class="arrow">→</span>
    </div>

    <div class="category-card" onclick="alert('Этот раздел находится в разработке')">
        <span class="category-title">🔥 3. Сброс веса</span>
        <span class="arrow">→</span>
    </div>

    <div class="category-card" onclick="alert('Этот раздел находится в разработке')">
        <span class="category-title">🏋️‍♂️ 4. Быть в форме</span>
        <span class="arrow">→</span>
    </div>

    <div class="category-card" onclick="alert('Этот раздел находится в разработке')">
        <span class="category-title">🎯 5. Специальные тренировки</span>
        <span class="arrow">→</span>
    </div>

    <div class="category-card" onclick="alert('Этот раздел находится в разработке')">
        <span class="category-title">🏖️ 6. К пляжу готов</span>
        <span class="arrow">→</span>
    </div>

    <div class="category-card" onclick="alert('Этот раздел находится в разработке')">
        <span class="category-title">🚀 7. Режим ракеты</span>
        <span class="arrow">→</span>
    </div>

    <div class="section-title">Дополнительно</div>

    <div class="category-card" onclick="alert('Этот раздел находится в разработке')">
        <span class="category-title">🍎 Основы питания</span>
        <span class="arrow">→</span>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на полный экран

        // Функция открытия защищенного поста из группы
        function openPost(url) {
            if (tg.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
